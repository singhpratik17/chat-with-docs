[project]
name = "chat-with-docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-community>=0.4.1",
    "pypdf>=6.1.3",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "fpdf2>=2.8.4",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
python_files = ["test_*.py"]

# --------------------------------------------
# BLACK (Formatter)
# --------------------------------------------
[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.ruff_cache
  | build
  | dist
)/
'''

# --------------------------------------------
# RUFF (Linter)
# --------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
]
